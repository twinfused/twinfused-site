# Technologies page. Add, remove or reorder freely.
- name: "LoRaWAN"
  icon: "radio"
  summary: "Long-range, low-power wireless for sensors spread across a site: soil moisture, tank levels, temperature, doors and occupancy."
- name: "Wi-Fi"
  icon: "wifi"
  summary: "Local wireless for gateways and devices that need more bandwidth. Our networking brand adds Wi-Fi simulation to plan access-point placement."
- name: "Zigbee"
  icon: "mesh"
  summary: "Low-power mesh networking for sensors, switches and smart devices, widely used in buildings and homes."
- name: "5G & LTE"
  icon: "cell"
  summary: "Cellular connectivity for remote sites, trackers and industrial routers, including industrial cellular networks."
- name: "Modbus"
  icon: "bus"
  summary: "A widely used industrial protocol for reading and controlling meters, drives, controllers and other equipment."
- name: "CAN bus"
  icon: "can"
  summary: "A robust data bus found in vehicles and machinery, used to read equipment data."
- name: "MQTT"
  icon: "mqtt"
  summary: "One of the foundations of our systems. An open, lightweight messaging standard that lets devices, edge servers and platforms from different makers share data, which helps eliminate data silos."
- name: "Ethernet"
  icon: "cable"
  summary: "A reliable wired backbone between gateways, servers and equipment."
- name: "Secure VPN"
  icon: "shield"
  summary: "Encrypted tunnels for safe remote access and data exchange between sites and platforms."
- name: "GPS tracking"
  icon: "pin"
  summary: "Location tracking of vehicles, equipment and assets, with history and alerts."
- name: "Edge servers"
  icon: "chip"
  summary: "On-site servers that run local control, data collection and alerting, so operations continue without a permanent internet connection."
- name: "Cloud platforms"
  icon: "cloud"
  summary: "Central dashboards, long-term storage, analytics and notifications you can reach anytime, anywhere."
